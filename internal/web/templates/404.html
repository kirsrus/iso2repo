<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>iso2repo — 404</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            color: #1a1a1a;
            background-color: #f5f5f5;
            padding: 32px;
        }

        .container {
            max-width: 800px;
            margin: 0;
            padding: 0;
            position: relative;
        }

        .logo {
            position: absolute;
            top: 0%;
            left: 50%;
            transform: translate(-50%, -65%);
            width: 200px;
            height: auto;
            opacity: 0.7;
            pointer-events: none;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #d0d0d0;
        }

        .error-code {
            font-size: 48px;
            font-weight: 600;
            color: #d0d0d0;
            line-height: 1.2;
            margin-top: 20px;
            margin-bottom: 4px;
        }

        .error-text {
            color: #888;
            margin-bottom: 20px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            padding: 4px 14px;
            background-color: #ffffff;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            text-decoration: none;
            color: #1a1a1a;
            transition: background-color 0.15s ease;
        }

        .back-link:hover {
            background-color: #f5f5f5;
        }

        .footer {
            margin-top: 24px;
            padding-top: 12px;
            border-top: 1px solid #d0d0d0;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="/logo.gif" alt="iso2repo">
        <h1>Страница не найдена</h1>

        <div class="error-code">404</div>
        <div class="error-text">Запрошенная страница не существует или была перемещена.</div>

        <a class="back-link" href="/">← На главную</a>

        <div class="footer">iso2repo</div>
    </div>
</body>
</html>
